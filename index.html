<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Harmonium Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet" />
<style>
  /* ---------- Harmonium Evolution brand tokens ---------- */
  :root{
    --navy:#0f3650;        /* base background */
    --navy-deep:#0a2740;   /* panels */
    --indigo:#271354;      /* gradient partner */
    --rose:#871449;        /* burgundy / rose accent */
    --gold:#E8B970;        /* primary accent */
    --gold-soft:#c9a84c;
    --cream:#FFFAF7;       /* text */
    --cream-dim:rgba(255,250,247,.68);
    --cream-faint:rgba(255,250,247,.42);
    --line:rgba(232,185,112,.28);
    --radius:16px;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Jost',system-ui,sans-serif;
    color:var(--cream);
    background:
      radial-gradient(120% 90% at 50% -10%, rgba(135,20,73,.35), transparent 60%),
      radial-gradient(90% 70% at 85% 110%, rgba(39,19,84,.55), transparent 55%),
      var(--navy);
    background-attachment:fixed;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:clamp(20px,5vw,56px) 20px;
  }
  /* ---------- Card with dual gradient border (brand signature) ---------- */
  .card{
    width:100%;
    max-width:640px;
    position:relative;
    border-radius:calc(var(--radius) + 4px);
    padding:1px;                 /* space for gradient border */
    background:linear-gradient(150deg, var(--gold), var(--rose) 60%, rgba(232,185,112,.25));
    box-shadow:0 30px 80px -30px rgba(0,0,0,.7);
  }
  .card-inner{
    background:linear-gradient(180deg, var(--navy-deep), #0b2c44);
    border-radius:var(--radius);
    padding:clamp(24px,5vw,44px);
  }
  /* ---------- Header / progress ---------- */
  .brand{
    font-family:'Pinyon Script',cursive;
    font-size:clamp(22px,4vw,28px);
    color:var(--gold);
    text-align:center;
    margin:0 0 22px;
    font-weight:400;
  }
  .dots{display:flex;gap:7px;justify-content:center;margin:0 0 26px;flex-wrap:wrap;}
  .dot{width:8px;height:8px;border-radius:50%;background:rgba(232,185,112,.22);transition:all .4s ease;}
  .dot.done{background:var(--gold-soft);}
  .dot.active{background:var(--gold);box-shadow:0 0 10px 1px rgba(232,185,112,.8);transform:scale(1.25);}

  /* ---------- Question ---------- */
  .step{animation:rise .45s cubic-bezier(.2,.7,.2,1);}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .q-count{font-size:13px;letter-spacing:.04em;color:var(--cream-faint);margin-bottom:10px;}
  h1.q{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    font-size:clamp(26px,4.6vw,36px);
    line-height:1.15;
    margin:0 0 24px;
    letter-spacing:.005em;
  }
  .hint{font-size:14px;color:var(--cream-dim);margin:-14px 0 22px;}

  /* ---------- Options ---------- */
  .options{display:flex;flex-direction:column;gap:11px;}
  .opt{
    display:flex;align-items:center;gap:14px;
    width:100%;text-align:left;
    font-family:'Jost',sans-serif;font-size:16px;color:var(--cream);
    background:rgba(255,250,247,.03);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    cursor:pointer;
    transition:border-color .2s, background .2s, transform .1s;
  }
  .opt:hover{border-color:var(--gold);background:rgba(232,185,112,.06);}
  .opt:active{transform:scale(.99);}
  .opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .opt .mark{
    flex:none;width:20px;height:20px;border-radius:50%;
    border:1.5px solid var(--gold-soft);position:relative;transition:all .2s;
  }
  .opt.sel{border-color:var(--gold);background:rgba(232,185,112,.10);}
  .opt.sel .mark{background:var(--gold);border-color:var(--gold);}
  .opt.sel .mark::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--navy-deep);}
  .opt.multi .mark{border-radius:6px;}
  .opt.multi.sel .mark::after{border-radius:2px;}

  /* ---------- Buttons ---------- */
  .row{display:flex;gap:12px;align-items:center;margin-top:26px;}
  .btn{
    font-family:'Jost',sans-serif;font-weight:500;font-size:16px;
    border:none;border-radius:999px;padding:15px 30px;cursor:pointer;
    transition:transform .12s, box-shadow .2s, opacity .2s;
  }
  .btn-primary{
    color:var(--navy-deep);
    background:linear-gradient(100deg, var(--gold), #e8a06e 55%, var(--rose));
    box-shadow:0 10px 26px -10px rgba(232,185,112,.7);
    margin-left:auto;
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 30px -10px rgba(232,185,112,.85);}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-ghost{background:transparent;color:var(--cream-dim);padding:15px 8px;}
  .btn-ghost:hover{color:var(--cream);}

  /* ---------- Email step ---------- */
  .field{margin:0 0 16px;}
  .field label{display:block;font-size:14px;color:var(--cream-dim);margin-bottom:7px;}
  .field input[type=text],.field input[type=email],.field input[type=tel]{
    width:100%;font-family:'Jost',sans-serif;font-size:16px;color:var(--cream);
    background:rgba(255,250,247,.04);border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;
  }
  .field input:focus{outline:none;border-color:var(--gold);background:rgba(232,185,112,.06);}
  .check{display:flex;gap:11px;align-items:flex-start;font-size:14px;color:var(--cream-dim);margin:0 0 12px;cursor:pointer;}
  .check input{margin-top:3px;accent-color:var(--gold);width:17px;height:17px;flex:none;}
  .fine{font-size:12.5px;color:var(--cream-faint);margin-top:6px;}
  .fine a{color:var(--gold-soft);}
  .err{color:#ffb4a2;font-size:14px;margin:10px 0 0;min-height:1em;}
  .loading{text-align:center;color:var(--cream-dim);padding:20px 0;}

  @media (prefers-reduced-motion:reduce){
    .step{animation:none;} .dot{transition:none;} .btn-primary:hover{transform:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="card-inner">
      <p class="brand">Harmonium Evolution</p>
      <div class="dots" id="dots" aria-hidden="true"></div>
      <div id="stage" aria-live="polite"></div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   CONFIG  — change these before / after deploy
   ============================================================ */
const CONFIG = {
  SUPABASE_URL:  "https://amrvuxvlsebrznwcqhij.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtcnZ1eHZsc2Vicnpud2NxaGlqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY0MTAyMTMsImV4cCI6MjA5MTk4NjIxM30.yizmM8VnZ-wujPHNG6uIw5KrMMkKahS6lqv8rscsPHU",
  SUPABASE_TABLE: "quiz_leads",     // matches the SQL Kenny runs in Supabase
  // TODO: replace with the real Systeme result-page URLs once they exist (build step 17)
  RESULT_URLS: {
    A: "https://harmoniumevolution.com/start-here",
    B: "https://harmoniumevolution.com/your-path",
    C: "https://harmoniumevolution.com/personal-guidance",
    D: "https://harmoniumevolution.com/free-lesson"
  },
  META_PIXEL_ID: ""   // TODO: add on build day 5 (tracking)
};

/* ============================================================
   QUIZ DEFINITION  (the 10 questions we locked)
   ============================================================ */
const QUESTIONS = [
  { id:"place", q:"Where do you play — or dream of playing?",
    opts:[
      ["home","Just for myself at home"],
      ["kirtan","Singing along at kirtan or satsang"],
      ["lead","I accompany or lead kirtan"],
      ["teach","I teach or hold space (yoga, sound healing)"]
    ]},
  { id:"level", q:"How long have you been playing harmonium?",
    opts:[
      ["none","Haven't started yet"],
      ["under1","Less than a year"],
      ["1to5","1–5 years"],
      ["over5","More than 5 years"]
    ]},
  { id:"learned", q:"How have you learned so far?",
    opts:[
      ["notyet","Not yet"],
      ["youtube","YouTube videos"],
      ["copying","Copying songs by ear"],
      ["lessons","A few lessons"],
      ["teacher","A teacher, for a while"]
    ]},
  { id:"sixmonths", q:"Where would you love to be six months from now?",
    opts:[
      ["firstsongs","Playing my first songs"],
      ["confident","Playing confidently with others"],
      ["leading","Leading kirtan"],
      ["teaching","Teaching others"],
      ["improv","Improvising freely"]
    ]},
  { id:"learnnext", q:"What do you most want to learn next?",
    opts:[
      ["basics","The basics, the right way"],
      ["chords","Chords & theory that finally click"],
      ["technique","Smoother technique"],
      ["playsing","Playing and singing together"],
      ["melody","Melody & improvisation"]
    ]},
  { id:"blocker", q:"What's holding you back most right now?",
    opts:[
      ["start","I don't know where to start"],
      ["stuck","I learned from YouTube but I'm stuck"],
      ["flat","My playing sounds flat — chords and rhythm don't flow"],
      ["freedom","I want to play more freely: melody, improvisation, leading"]
    ]},
  { id:"musiccheck", q:"Quick music check — which notes make a C minor chord?",
    hint:"No wrong door here — it just helps me meet you where you are.",
    opts:[
      ["correct","C – E♭ – G"],
      ["cmajor","C – E – G"],
      ["byear","I can follow it in a song, but not the theory"],
      ["notsure","Not sure — but I'd love to finally understand chords"]
    ]},
  { id:"harmonium", q:"Do you have a harmonium to practice on?",
    opts:[
      ["yes","Yes"],
      ["onway","It's on its way"],
      ["notyet","Not yet"]
    ]},
  { id:"time", q:"How much time can you realistically practice each week?",
    opts:[
      ["under1","Under 1 hour"],
      ["1to3","1–3 hours"],
      ["3to5","3–5 hours"],
      ["5plus","5+ hours"]
    ]},
  { id:"invest", q:"Learning this properly is an investment in yourself. What feels true right now?",
    opts:[
      ["free","I'm just looking for free tips for now"],
      ["affordable","I'd like an affordable way to start"],
      ["complete","I'm ready to invest in a complete course to finally learn this the right way"],
      ["guidance","I want personal guidance from Kenny, and I'm ready to invest in that"]
    ]}
];

/* ============================================================
   ROUTING  — turns the answers into a route + qualification
   ============================================================ */
function computeRoute(a){
  const invest = a.invest, harm = a.harmonium, level = a.level, time = a.time;
  const hasHarmonium = (harm === "yes" || harm === "onway");
  const wantsToBuy   = (invest === "complete" || invest === "guidance");

  // Not qualified -> Route D (free lesson + email list, no call, no QualifiedLead)
  if (!wantsToBuy || !hasHarmonium){
    return { route:"D", qualified:false, advanced:false };
  }
  // Qualified from here on
  if (invest === "guidance"){
    return { route:"C", qualified:true, advanced:false };
  }
  // invest === "complete"
  const advanced =
    level === "over5" ||
    a.place === "lead" || a.place === "teach" ||
    a.sixmonths === "leading" || a.sixmonths === "teaching" || a.sixmonths === "improv";

  const beginner = (level === "none" || level === "under1") && a.musiccheck !== "correct";
  const route = beginner ? "A" : "B";
  return { route, qualified:true, advanced: (route === "B" && advanced) };
}

/* ============================================================
   STATE + helpers
   ============================================================ */
const answers = {};
let idx = 0;
let started = false;
const stage = document.getElementById("stage");
const dotsEl = document.getElementById("dots");
const TOTAL = QUESTIONS.length;

function uuid(){
  return (crypto.randomUUID && crypto.randomUUID()) ||
    "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{
      const r=Math.random()*16|0; return (c==="x"?r:(r&0x3|0x8)).toString(16);});
}
const eventId = uuid();

function getCookie(n){
  const m = document.cookie.match("(^|;)\\s*"+n+"\\s*=\\s*([^;]+)"); return m?m.pop():"";
}
function getUTM(){
  const p = new URLSearchParams(location.search);
  return {
    utm_source:   p.get("utm_source")   || "",
    utm_campaign: p.get("utm_campaign") || "",
    utm_content:  p.get("utm_content")  || "",
    utm_medium:   p.get("utm_medium")   || ""
  };
}
function fire(event, extra){          // Meta pixel hook (real pixel added on build day 5)
  if (window.fbq) window.fbq("trackCustom", event, Object.assign({eventID:eventId}, extra||{}));
}

function renderDots(){
  dotsEl.innerHTML = "";
  for (let i=0;i<TOTAL;i++){
    const d=document.createElement("span");
    d.className="dot"+(i<idx?" done":"")+(i===idx?" active":"");
    dotsEl.appendChild(d);
  }
}

/* ============================================================
   QUESTION SCREENS
   ============================================================ */
function renderQuestion(){
  renderDots();
  const Q = QUESTIONS[idx];
  const chosen = answers[Q.id];

  const wrap = document.createElement("div");
  wrap.className = "step";
  wrap.innerHTML =
    `<p class="q-count">Question ${idx+1} of ${TOTAL}</p>
     <h1 class="q">${Q.q}</h1>
     ${Q.hint ? `<p class="hint">${Q.hint}</p>` : ""}
     <div class="options"></div>
     <div class="row">
       ${idx>0 ? `<button class="btn btn-ghost" id="back">← Back</button>` : ""}
       <button class="btn btn-primary" id="next" disabled>${idx===TOTAL-1 ? "See my result" : "Continue"}</button>
     </div>`;

  const optsBox = wrap.querySelector(".options");
  Q.opts.forEach(([val,label])=>{
    const b=document.createElement("button");
    b.className="opt"+(chosen===val?" sel":"");
    b.innerHTML=`<span class="mark"></span><span>${label}</span>`;
    b.onclick=()=>{
      answers[Q.id]=val;
      optsBox.querySelectorAll(".opt").forEach(o=>o.classList.remove("sel"));
      b.classList.add("sel");
      wrap.querySelector("#next").disabled=false;
      if (!started){ started=true; fire("QuizStart"); }  // first answer = engaged
    };
    optsBox.appendChild(b);
  });

  swap(wrap);
  if (chosen) wrap.querySelector("#next").disabled=false;
  const back=wrap.querySelector("#back"); if(back) back.onclick=()=>{ idx--; renderQuestion(); };
  wrap.querySelector("#next").onclick=()=>{
    if (idx===TOTAL-1) renderEmail(); else { idx++; renderQuestion(); }
  };
}

/* ============================================================
   EMAIL STEP  (the moment someone becomes a Lead)
   ============================================================ */
function renderEmail(){
  renderDots();
  const wrap=document.createElement("div");
  wrap.className="step";
  wrap.innerHTML=
    `<p class="q-count">Last step</p>
     <h1 class="q">Your result is ready.</h1>
     <p class="hint">Where should I send your personal plan and the free masterclass?</p>
     <div class="field"><label for="fn">First name</label><input id="fn" type="text" autocomplete="given-name" /></div>
     <div class="field"><label for="em">Email</label><input id="em" type="email" autocomplete="email" /></div>
     <div class="field"><label for="wa">WhatsApp number <span style="color:var(--cream-faint)">(optional)</span></label><input id="wa" type="tel" autocomplete="tel" placeholder="+1 …" /></div>
     <label class="check"><input type="checkbox" id="c-email" /><span>Yes, send me my plan, the masterclass and helpful lessons by email.</span></label>
     <label class="check"><input type="checkbox" id="c-wa" /><span>You may message me on WhatsApp about my result (only if I filled it in).</span></label>
     <div class="err" id="err"></div>
     <div class="row">
       <button class="btn btn-ghost" id="back">← Back</button>
       <button class="btn btn-primary" id="submit">Show my result</button>
     </div>
     <p class="fine">We respect your privacy. See our <a href="https://harmoniumevolution.com/privacy" target="_blank" rel="noopener">privacy policy</a>. Unsubscribe anytime.</p>`;
  swap(wrap);
  wrap.querySelector("#back").onclick=()=>{ idx=TOTAL-1; renderQuestion(); };
  wrap.querySelector("#submit").onclick=submit;
}

function submit(){
  const fn=document.getElementById("fn").value.trim();
  const em=document.getElementById("em").value.trim();
  const wa=document.getElementById("wa").value.trim();
  const cEmail=document.getElementById("c-email").checked;
  const cWa=document.getElementById("c-wa").checked;
  const err=document.getElementById("err");

  if(!fn){ err.textContent="Please add your first name."; return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ err.textContent="Please enter a valid email."; return; }
  if(!cEmail){ err.textContent="Please tick the box so I can send your plan."; return; }
  err.textContent="";

  const btn=document.getElementById("submit");
  btn.disabled=true; btn.textContent="One moment…";

  const r=computeRoute(answers);
  const utm=getUTM();
  const payload={
    event_id:eventId,
    first_name:fn, email:em,
    whatsapp: cWa ? wa : "",
    email_consent:cEmail, whatsapp_consent: cWa && !!wa,
    answers:answers,
    route:r.route, qualified:r.qualified, advanced:r.advanced,
    utm_source:utm.utm_source, utm_campaign:utm.utm_campaign,
    utm_content:utm.utm_content, utm_medium:utm.utm_medium,
    fbp:getCookie("_fbp"), fbc:getCookie("_fbc"),
    page_url:location.href
  };

  fire("Lead");
  if(r.qualified) fire("QualifiedLead");

  saveToSupabase(payload).finally(()=>redirect(r, fn));
}

/* ============================================================
   SUPABASE  (writes one row; keys are public/anon on purpose)
   ============================================================ */
function saveToSupabase(payload){
  return fetch(`${CONFIG.SUPABASE_URL}/rest/v1/${CONFIG.SUPABASE_TABLE}`,{
    method:"POST",
    headers:{
      "apikey":CONFIG.SUPABASE_ANON_KEY,
      "Authorization":"Bearer "+CONFIG.SUPABASE_ANON_KEY,
      "Content-Type":"application/json",
      "Prefer":"return=minimal"
    },
    body:JSON.stringify(payload)
  }).catch(e=>console.error("Supabase save failed (continuing anyway):",e));
}

/* ============================================================
   REDIRECT to the right result page, carrying light personalisation
   ============================================================ */
function redirect(r, firstName){
  const base=CONFIG.RESULT_URLS[r.route] || CONFIG.RESULT_URLS.D;
  const q=new URLSearchParams({
    fn:firstName,
    role:answers.place||"",
    frustration:answers.blocker||"",
    goal:answers.sixmonths||"",
    route:r.route
  });
  location.href = base + (base.includes("?")?"&":"?") + q.toString();
}

/* utility: fade the stage */
function swap(node){ stage.innerHTML=""; stage.appendChild(node); window.scrollTo({top:0,behavior:"instant"}); }

/* go */
renderQuestion();
</script>
</body>
</html>
